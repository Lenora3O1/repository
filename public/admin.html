<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系統總後台｜平台規則中心</title><style>
:root{--bg:#f4f6f5;--panel:#fff;--line:#dce4e0;--text:#18302a;--muted:#66756f;--accent:#2f6f5e;--accent2:#e7f3ee;--danger:#a33b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text)}button,input,select{font:inherit}.top{height:64px;background:#173e33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10}.brand{font-weight:800;font-size:19px}.top small{opacity:.72}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:260px;background:#fff;border-right:1px solid var(--line);padding:18px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--text)}.nav button.active,.nav button:hover{background:var(--accent2);color:var(--accent)}main{flex:1;padding:28px;max-width:1100px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px #18302a08}.hero h1{margin:0 0 8px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcfb}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:9px 10px;border:1px solid #cbd6d1;border-radius:9px;background:#fff}.switch{display:flex;align-items:center;gap:8px}.section-title{font-size:18px;font-weight:800;margin-bottom:12px}.subcard{border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:12px}.subcard h3{margin:0 0 12px;font-size:16px}.actions{display:flex;gap:10px;align-items:center;margin-top:18px}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700}.secondary{background:#fff;color:var(--text);border:1px solid #cbd6d1;border-radius:10px;padding:10px 16px;cursor:pointer}.notice{padding:11px 13px;border-radius:10px;background:#fff7e3;border:1px solid #ead29a;color:#5d4a1f;margin:12px 0}.status{font-weight:700}.ok{color:#23724f}.error{color:var(--danger)}.login{max-width:420px;margin:80px auto}.login h1{margin-top:0}.history{font-size:14px}.history details{border-top:1px solid var(--line);padding:10px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#edf4f1;color:#2f6f5e;font-size:12px;font-weight:700}@media(max-width:760px){aside{width:190px}main{padding:16px}.grid{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><script src="admin.js?v=1.0.0"></script></body></html>
