<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>面試填寫</title>
<meta name="robots" content="noindex">
<style>
:root{--bg1:#FBF6F0;--bg2:#F1E6DE;--card:#FFFDFB;--line:#EADBD2;--soft:#F7EEE8;--accent:#C0785B;--accent2:#8FA88A;--ink:#3E2E2A;--muted:#9B8079;--pink:#F3DDD5}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;font-size:17px;line-height:1.7;background:radial-gradient(1200px 600px at 10% -10%,#FFF 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#F6E2D8 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 36px;color:var(--muted)}
header .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1px;color:#7A5A50}header .brand span{font-size:1.4rem}
header small{font-size:.85rem}
main{max-width:980px;margin:6px auto 0;padding:0 22px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:34px 40px;box-shadow:0 20px 50px rgba(150,110,95,.10)}
h2{margin:0 0 6px;color:#6B4A40;font-size:1.6rem;font-weight:700;letter-spacing:.5px}.sub{color:var(--muted);margin:0 0 22px}
.hello{text-align:center;padding:10px 0 4px}.hello .leaf{font-size:2.6rem}.hello h2{font-size:2rem}.hello p{color:var(--muted);margin:6px 0 26px}
.steps{display:flex;gap:6px;margin:0 0 22px;flex-wrap:wrap}.steps span{padding:3px 12px;border-radius:999px;background:var(--soft);color:#B39A92;font-size:.8rem;font-weight:700}.steps span.on{background:var(--accent);color:#fff}.steps span.done{background:#DCC8BF;color:#fff}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.opt{border:2px solid transparent;border-radius:24px;padding:28px 22px;cursor:pointer;background:linear-gradient(180deg,#FFF,#FBF3EE);text-align:center;transition:.2s;box-shadow:0 8px 24px rgba(150,110,95,.08)}
.opt:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(150,110,95,.14)}.opt.sel{border-color:var(--accent);background:#FFF7F3}
.opt i{font-style:normal;font-size:2.4rem;display:block}.opt b{display:block;font-size:1.35rem;color:#6B4A40;margin:8px 0 4px}.opt span{color:var(--muted);font-size:.92rem}
.pos{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.pos label{border:1px solid var(--line);border-radius:999px;padding:7px 16px;cursor:pointer;background:#fff;font-size:.95rem}.pos label.sel{background:var(--pink);border-color:var(--accent)}.pos input{display:none}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 18px}.grid label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem;color:#6B4A40}.grid .w2{grid-column:span 2}.grid .w4{grid-column:1/-1}
input,select,textarea{font:inherit;padding:11px 14px;border:1px solid #E3D2C8;border-radius:14px;background:#fff;width:100%;color:var(--ink)}input:focus,select:focus,textarea:focus{outline:3px solid #F1D8CC;border-color:var(--accent)}
.sec{margin:26px 0 12px;font-weight:700;color:#6B4A40;font-size:1.05rem;display:flex;align-items:center;gap:8px}.sec::after{content:'';flex:1;height:1px;background:var(--line)}
table{width:100%;border-collapse:collapse}td,th{padding:5px;text-align:left;font-size:.92rem}th{color:var(--muted);font-weight:600}
button{font:inherit;font-weight:700;border-radius:999px;padding:12px 30px;border:0;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 8px 18px rgba(192,120,91,.25);transition:.15s}button:hover{filter:brightness(1.05)}
button.sec2{background:#fff;color:#7A5A50;border:1px solid var(--line);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:28px;align-items:center}
.note{background:var(--soft);border-radius:18px;padding:16px 20px;color:#6B4A40;line-height:1.9}
.err{background:#FBE7E0;border:1px solid #F0CDBF;color:#8A3B22;border-radius:14px;padding:10px 16px;margin:14px 0;display:none}
.q{border:1px solid var(--line);border-radius:20px;padding:18px 22px;margin-bottom:14px;background:#fff}.q h3{margin:0 0 10px;font-size:1.05rem;font-weight:700;color:#5A3E36}.q .opt2{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;cursor:pointer}.q .opt2:hover{background:var(--soft)}.q .opt2 input{width:auto;margin-top:6px}
.q .pt{float:right;color:#B39A92;font-size:.82rem}
.center{text-align:center}.timer{color:var(--muted);font-weight:600}
.lic{display:flex;flex-wrap:wrap;gap:8px 18px}.lic label{display:flex;flex-direction:row;font-weight:500;align-items:center;gap:6px;color:var(--ink)}.lic input{width:auto}
.ty-src{background:#FFF8F4;border:1px dashed #E7C7B8;border-radius:18px;padding:18px 22px;font-size:1.15rem;line-height:2;letter-spacing:1px;user-select:none;-webkit-user-select:none}
.ty-src .ok{color:#7E9B77}.ty-src .bad{color:#C0563A;text-decoration:underline}.ty-src .cur{background:#F6D9CC;border-radius:4px}
.ty-box{font-size:1.15rem;line-height:2;letter-spacing:1px;min-height:150px}
.ty-meta{display:flex;gap:18px;color:var(--muted);font-weight:600;margin-top:8px;flex-wrap:wrap}
.login{max-width:440px;margin:30px auto}.login .grid{grid-template-columns:1fr}
.foot{display:flex;justify-content:center;gap:14px;margin-top:16px;color:#B39A92;font-size:.85rem}.foot a{color:#B39A92;cursor:pointer;text-decoration:underline}
.idle{position:fixed;inset:0;background:rgba(80,55,48,.35);display:flex;align-items:center;justify-content:center;z-index:50}.idle .card{max-width:440px;text-align:center}
</style>
</head>
<body>
<header><div class="brand"><span>🌿</span><span id="hd">面試填寫</span></div><small id="hd2">請使用電腦的鍵盤與滑鼠填寫</small></header>
<main><div class="card" id="app"><p>讀取中…</p></div><div class="foot" id="foot"></div></main>
<script>
(function(){
  const $=s=>document.querySelector(s);const app=$('#app');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let META=null,S=null;
  const metrics={keys:0,chars:0,paste_blocked:0,blur:0,clicks:0};let t0=0,tResume=0,tQuiz=0;
  async function api(path,body){const r=await fetch(`/api/interview-kiosk${path}`,body?{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{credentials:'same-origin',cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok){const e=new Error(d.error||'操作失敗');e.status=r.status;throw e;}return d;}
  const isDesktop=()=>{const coarse=matchMedia('(pointer:coarse)').matches&&!matchMedia('(pointer:fine)').matches;return !coarse&&window.innerWidth>=1000&&!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);};
  const STEPS=['應徵職務','個資告知','履歷','打字小測驗','工作經驗','考核題目','完成'];
  const steps=i=>`<div class="steps">${STEPS.map((s,k)=>`<span class="${k<i?'done':k===i?'on':''}">${s}</span>`).join('')}</div>`;
  function showErr(m){const e=$('#err');if(e){e.textContent=m;e.style.display='block';e.scrollIntoView({behavior:'smooth',block:'center'});}else alert(m);}
  // 每位面試者的欄位名稱都不一樣，瀏覽器不會跳出上一位填過的內容
  function noAutofill(){const tag=Math.random().toString(36).slice(2,8);app.querySelectorAll('input,textarea,select').forEach((el,i)=>{el.setAttribute('autocomplete','off');el.setAttribute('autocorrect','off');el.setAttribute('spellcheck','false');if(!['radio','checkbox'].includes(el.type))el.name=`f${tag}${i}`;});}
  // 操作紀錄：鍵盤、輸入字數、貼上、切換視窗、滑鼠點擊
  document.addEventListener('keydown',()=>{if(S)metrics.keys++;},true);
  document.addEventListener('input',e=>{if(S&&e.inputType&&e.inputType.startsWith('insert')&&e.data)metrics.chars+=e.data.length;},true);
  document.addEventListener('paste',e=>{if(!S)return;e.preventDefault();metrics.paste_blocked++;showErr('這裡請自己用鍵盤輸入，不能貼上喔。');},true);
  document.addEventListener('drop',e=>{if(S)e.preventDefault();},true);
  window.addEventListener('blur',()=>{if(S)metrics.blur++;});document.addEventListener('mousedown',()=>{if(S)metrics.clicks++;},true);
  // 太久沒有操作：先問「還在嗎？」，60 秒沒回應就清空回到開始畫面
  const IDLE_MIN=8;let idle=null,idleBox=null,idleTick=null;
  function resetIdle(){clearTimeout(idle);if(idleBox)return;if(!S)return;idle=setTimeout(askIdle,IDLE_MIN*60e3);}
  function askIdle(){if(!S)return;let n=60;idleBox=document.createElement('div');idleBox.className='idle';idleBox.innerHTML=`<div class="card"><div style="font-size:2rem">☕</div><h2>你還在嗎？</h2><p class="sub">已經 ${IDLE_MIN} 分鐘沒有操作了。<br><b id="idN">${n}</b> 秒後會清除資料、回到開始畫面。</p><div class="bar" style="justify-content:center"><button class="sec2" id="idR">重新開始</button><button id="idK">我還在，繼續填寫</button></div></div>`;document.body.appendChild(idleBox);
    const close=()=>{clearInterval(idleTick);idleBox?.remove();idleBox=null;};
    idleBox.querySelector('#idK').onclick=()=>{close();resetIdle();};idleBox.querySelector('#idR').onclick=()=>{close();start();};
    idleTick=setInterval(()=>{n--;const x=document.getElementById('idN');if(x)x.textContent=n;if(n<=0){close();start();}},1000);}
  ['keydown','mousedown','input'].forEach(ev=>document.addEventListener(ev,resetIdle,true));

  async function boot(){
    if(!isDesktop()){app.innerHTML='<div class="hello"><div class="leaf">💻</div><h2>請使用公司的電腦填寫</h2><p>面試資料需要用電腦的鍵盤與滑鼠填寫，手機和平板不能使用。<br>請向面試人員詢問面試用的電腦。</p></div>';return;}
    try{META=await api('/meta');}catch(e){if(e.status===401)return login();app.innerHTML=`<div class="hello"><h2>目前無法填寫</h2><p>${esc(e.message)}</p></div>`;return;}
    $('#hd').textContent=`${META.company}｜面試填寫`;
    if(META.must_change)return changePw(true);
    if(!META.enabled){app.innerHTML='<div class="hello"><h2>目前沒有開放面試填寫</h2><p>請洽公司人事。</p></div>';return;}
    start();
  }
  // ---------- 面試帳號登入（由人事在面試電腦登入一次） ----------
  function login(msg){
    S=null;$('#foot').innerHTML='';$('#hd').textContent='面試登入';
    app.innerHTML=`<div class="login"><div class="hello"><div class="leaf">🌿</div><h2>面試登入</h2><p>請公司人事用「面試專用帳號」登入這台電腦。</p></div>
      ${msg?`<div class="err" style="display:block">${esc(msg)}</div>`:''}<div class="grid"><label>公司代碼<input id="lc"></label><label>面試帳號密碼<input id="lp" type="password"></label></div><div class="err" id="err"></div>
      <div class="bar" style="justify-content:center"><button id="lgo">登入</button></div><p class="sub center" style="margin-top:16px;font-size:.88rem">面試帳號由系統服務商建立；忘記密碼請洽系統服務商重新設定。</p></div>`;
    noAutofill();$('#lp').setAttribute('autocomplete','new-password');
    const go=async()=>{try{const r=await api('/login',{code:$('#lc').value.trim(),password:$('#lp').value});if(r.must_change)return changePw(true);boot();}catch(e){showErr(e.message);}};
    $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go();};
  }
  function changePw(first){
    S=null;app.innerHTML=`<div class="login"><div class="hello"><div class="leaf">🔑</div><h2>${first?'第一次登入，請設定新密碼':'修改面試帳號密碼'}</h2><p>新密碼至少 8 碼，要同時有英文字母和數字。</p></div>
      <div class="grid">${first?'':'<label>目前密碼<input id="pc" type="password"></label>'}<label>新密碼<input id="p1" type="password"></label><label>再輸入一次<input id="p2" type="password"></label></div><div class="err" id="err"></div>
      <div class="bar">${first?'<span></span>':'<button class="sec2" id="pb">返回</button>'}<button id="pgo">確定</button></div></div>`;
    noAutofill();['p1','p2','pc'].forEach(i=>$('#'+i)?.setAttribute('autocomplete','new-password'));
    $('#pb')?.addEventListener('click',start);
    $('#pgo').onclick=async()=>{if($('#p1').value!==$('#p2').value)return showErr('兩次輸入的新密碼不一樣');try{await api('/password',{password:$('#p1').value,current:$('#pc')?.value||''});alert('密碼已更新。');boot();}catch(e){if(e.status===401)return login(e.message);showErr(e.message);}};
  }
  const ICON={admin_head:'🏡',admin_secretary:'☕',duty:'🛡️'};
  function start(){
    if(app._ac)app._ac.abort();S={};Object.keys(metrics).forEach(k=>metrics[k]=0);t0=Date.now();window.scrollTo(0,0);clearTimeout(idle);
    app.innerHTML=`<div class="hello"><div class="leaf">🌿</div><h2>歡迎你來！</h2><p>放輕鬆，慢慢填就好。先選擇你想應徵的工作吧 😊</p></div>
      <div class="opts">${META.options.map(o=>`<div class="opt" data-o="${o.id}"><i>${ICON[o.id]||'🌸'}</i><b>${esc(o.name)}</b><span>${esc(o.hint)}</span></div>`).join('')}</div><div id="posBox"></div><div class="err" id="err"></div>
      <div class="bar"><span></span><button id="next" disabled>下一步</button></div>`;
    $('#foot').innerHTML='<a id="fPw">修改面試帳號密碼</a><a id="fOut">結束今天的面試（登出）</a>';
    $('#fPw').onclick=()=>changePw(false);$('#fOut').onclick=async()=>{if(!confirm('要登出面試帳號嗎？登出後需要人事重新登入。'))return;try{await api('/logout',{});}catch{}login();};
    app.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{S.option=el.dataset.o;app.querySelectorAll('[data-o]').forEach(x=>x.classList.toggle('sel',x===el));const o=META.options.find(x=>x.id===S.option);S.position='';
      $('#posBox').innerHTML=`<p style="margin:24px 0 0;font-weight:700;color:#6B4A40">想應徵的職位（可以不選）</p><div class="pos">${o.positions.map(p=>`<label><input type="radio" name="pos" value="${esc(p)}">${esc(p)}</label>`).join('')}<label><input type="radio" name="pos" value="">還不確定</label></div>`;
      app.querySelectorAll('[name=pos]').forEach(r=>r.onchange=()=>{S.position=r.value;app.querySelectorAll('.pos label').forEach(l=>l.classList.toggle('sel',l.contains(r)));});$('#next').disabled=false;});
    $('#next').onclick=consent;
  }
  const opt=()=>META.options.find(x=>x.id===S.option);
  function consent(){
    $('#foot').innerHTML='';
    app.innerHTML=`${steps(1)}<h2>個人資料蒐集告知</h2><p class="sub">請看一下以下說明，同意後就可以開始填寫。</p><div class="note">${esc(META.consent).replace(/\n/g,'<br>')}</div>
      <label style="display:flex;gap:10px;align-items:center;margin-top:18px;font-weight:700"><input type="checkbox" id="ok" style="width:auto"> 我已閱讀並同意以上說明</label><div class="err" id="err"></div>
      <div class="bar"><button class="sec2" id="back">上一步</button><button id="next">同意，開始填寫</button></div>`;
    $('#back').onclick=start;
    $('#next').onclick=async()=>{if(!$('#ok').checked)return showErr('請先勾選同意。');try{const r=await api('/start',{option:S.option,position:S.position,consent:true});S.token=r.token;tResume=Date.now();resetIdle();resume();}catch(e){if(e.status===401)return login(e.message);showErr(e.message);}};
  }
  function resume(){
    const o=opt();const R=S.resume||{};
    const eduRow=(e={})=>`<tr><td><input data-k="school" value="${esc(e.school||'')}" placeholder="學校"></td><td><input data-k="major" value="${esc(e.major||'')}" placeholder="科系"></td><td><select data-k="degree">${['','國中','高中職','專科','大學','碩士以上'].map(x=>`<option ${e.degree===x?'selected':''}>${x}</option>`).join('')}</select></td><td><select data-k="status">${['畢業','肄業','就學中'].map(x=>`<option ${e.status===x?'selected':''}>${x}</option>`).join('')}</select></td></tr>`;
    const workRow=(w={})=>`<tr><td><input data-k="company" value="${esc(w.company||'')}" placeholder="公司名稱"></td><td><input data-k="title" value="${esc(w.title||'')}" placeholder="職稱"></td><td><input data-k="start" type="month" value="${esc(w.start||'')}"></td><td><input data-k="end" type="month" value="${esc(w.end||'')}"></td><td><input data-k="duty" value="${esc(w.duty||'')}" placeholder="主要工作內容"></td><td><input data-k="reason" value="${esc(w.reason||'')}" placeholder="離職原因"></td></tr>`;
    app.innerHTML=`${steps(2)}<h2>個人履歷</h2><p class="sub">應徵：${esc(o.name)}${S.position?`｜${esc(S.position)}`:''}。標示 * 的欄位一定要填，其他想寫多少都可以。</p>
      <div class="sec">基本資料</div><div class="grid">
        <label>姓名 *<input id="f-name" value="${esc(R.name||'')}"></label><label>性別<select id="f-gender"><option value="">請選擇</option><option value="M" ${R.gender==='M'?'selected':''}>男</option><option value="F" ${R.gender==='F'?'selected':''}>女</option></select></label><label>生日 *<input type="date" id="f-birthday" value="${esc(R.birthday||'')}"></label><label>手機 *<input id="f-phone" inputmode="tel" value="${esc(R.phone||'')}" placeholder="0912345678"></label>
        <label>證件 *<select id="f-id_type"><option value="national">身分證</option><option value="arc" ${R.id_type==='arc'?'selected':''}>居留證</option><option value="passport" ${R.id_type==='passport'?'selected':''}>護照</option></select></label><label>證號 *<input id="f-id_no" value="${esc(R.id_no||'')}" placeholder="A123456789"></label><label class="w2" id="natL">國籍<input id="f-nationality" value="${esc(R.nationality||'')}"></label>
        <label class="w2">Email<input id="f-email" type="email" value="${esc(R.email||'')}"></label><label class="w2">通訊地址<input id="f-address" value="${esc(R.address||'')}"></label>
        <label>緊急聯絡人<input id="f-emergency_name" value="${esc(R.emergency_name||'')}"></label><label>關係<input id="f-emergency_relation" value="${esc(R.emergency_relation||'')}"></label><label>緊急聯絡電話<input id="f-emergency_phone" value="${esc(R.emergency_phone||'')}"></label><label>通勤方式<select id="f-transport">${['','機車','汽車','大眾運輸','步行／腳踏車'].map(x=>`<option ${R.transport===x?'selected':''}>${x}</option>`).join('')}</select></label></div>
      <div class="sec">學歷</div><table><thead><tr><th>學校</th><th>科系</th><th>學歷</th><th>狀態</th></tr></thead><tbody id="edu">${(R.education?.length?R.education:[{}]).map(eduRow).join('')}</tbody></table><button class="sec2" id="eduAdd" style="padding:6px 16px;margin-top:6px">＋ 學歷</button>
      <div class="sec">工作經歷（最近的寫在最上面）</div><table><thead><tr><th>公司</th><th>職稱</th><th>開始</th><th>結束</th><th>工作內容</th><th>離職原因</th></tr></thead><tbody id="work">${(R.work?.length?R.work:[{},{}]).map(workRow).join('')}</tbody></table><button class="sec2" id="workAdd" style="padding:6px 16px;margin-top:6px">＋ 經歷</button>
      <div class="sec">證照與技能</div><div class="lic">${(o.licenses||[]).map(l=>`<label><input type="checkbox" name="lic" value="${esc(l)}" ${(R.licenses||[]).includes(l)?'checked':''}>${esc(l)}</label>`).join('')}</div><div class="grid" style="margin-top:10px"><label class="w4">其他證照或技能<input id="f-other_license" value="${esc(R.other_license||'')}"></label></div>
      <div class="sec">工作意願</div><div class="grid"><label>可以上班日期<input type="date" id="f-available_date" value="${esc(R.available_date||'')}"></label><label>期望月薪<input type="number" id="f-expected_salary" min="0" value="${esc(R.expected_salary||'')}"></label>${o.category==='duty'?`<label class="w2">班別意願<select id="f-shift_pref">${['都可以','日班','夜班'].map(x=>`<option ${R.shift_pref===x?'selected':''}>${x}</option>`).join('')}</select></label>`:''}
        <label class="w4">自我介紹（請用鍵盤輸入，大約 100 字）<textarea id="f-intro" rows="5" placeholder="介紹一下自己、過去的工作經驗，以及為什麼想來這裡工作。">${esc(R.intro||'')}</textarea><small style="font-weight:400;color:var(--muted)" id="introN"></small></label></div>
      <div class="err" id="err"></div><div class="bar"><span></span><button id="next">下一步</button></div>`;
    noAutofill();
    $('#eduAdd').onclick=()=>{$('#edu').insertAdjacentHTML('beforeend',eduRow());noAutofill();};$('#workAdd').onclick=()=>{$('#work').insertAdjacentHTML('beforeend',workRow());noAutofill();};
    const nat=()=>{$('#natL').style.visibility=$('#f-id_type').value==='national'?'hidden':'visible';};$('#f-id_type').onchange=nat;nat();
    const cnt=()=>{$('#introN').textContent=`已輸入 ${$('#f-intro').value.trim().length} 字`;};$('#f-intro').oninput=cnt;cnt();
    $('#next').onclick=async()=>{const v=id=>$('#f-'+id)?.value||'';const rows=sel=>[...app.querySelectorAll(sel+' tr')].map(tr=>Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(i=>[i.dataset.k,i.value])));
      const r={name:v('name'),gender:v('gender'),birthday:v('birthday'),phone:v('phone'),id_type:v('id_type'),id_no:v('id_no'),nationality:v('nationality'),email:v('email'),address:v('address'),emergency_name:v('emergency_name'),emergency_relation:v('emergency_relation'),emergency_phone:v('emergency_phone'),transport:v('transport'),
        education:rows('#edu'),work:rows('#work'),licenses:[...app.querySelectorAll('[name=lic]:checked')].map(x=>x.value),other_license:v('other_license'),available_date:v('available_date'),expected_salary:v('expected_salary'),shift_pref:v('shift_pref'),intro:v('intro'),position:S.position||''};
      S.resume=r;if(r.intro.trim().length<20)return showErr('自我介紹請至少寫 20 個字喔。');
      try{await api('/resume',{token:S.token,resume:r});tResume=Date.now()-tResume;META.typing?.enabled?typing():experience();}catch(e){if(e.status===410||e.status===401){alert(e.message);return e.status===401?login(e.message):start();}showErr(e.message);}};
  }
  // ---------- 中文打字小測驗 ----------
  function typing(){
    const T=[...META.typing.text.replace(/\s+/g,'')];const LIMIT=META.typing.seconds;let startAt=0,timer=null,doneFlag=false;
    app.innerHTML=`${steps(3)}<h2>打字小測驗 ⌨️</h2><p class="sub">請照著下面這段文字打字，時間 ${Math.round(LIMIT/60)} 分鐘，打多少算多少，不用緊張。從你打第一個字開始計時。</p>
      <div class="ty-src" id="src"></div><textarea class="ty-box" id="ty" rows="5" placeholder="從這裡開始打字…"></textarea>
      <div class="ty-meta"><span id="tyT">剩下 ${Math.floor(LIMIT/60)} 分 ${String(LIMIT%60).padStart(2,'0')} 秒</span><span id="tyN">已打 0 / ${T.length} 字</span></div><div class="err" id="err"></div>
      <div class="bar"><span></span><button id="next">完成，下一步</button></div>`;
    noAutofill();
    const box=$('#ty');const paint=()=>{const v=[...box.value.replace(/\s+/g,'')];$('#src').innerHTML=T.map((c,i)=>`<span class="${i<v.length?(v[i]===c?'ok':'bad'):i===v.length?'cur':''}">${esc(c)}</span>`).join('');$('#tyN').textContent=`已打 ${v.length} / ${T.length} 字`;};
    const finish=async()=>{if(doneFlag)return;doneFlag=true;clearInterval(timer);box.disabled=true;const sec=startAt?Math.min(LIMIT,Math.round((Date.now()-startAt)/1000)):LIMIT;
      try{await api('/typing',{token:S.token,typed:box.value,seconds:Math.max(1,sec)});experience();}catch(e){doneFlag=false;box.disabled=false;if(e.status===410||e.status===401){alert(e.message);return e.status===401?login(e.message):start();}showErr(e.message);}};
    box.addEventListener('input',()=>{if(!startAt){startAt=Date.now();timer=setInterval(()=>{const left=LIMIT-Math.round((Date.now()-startAt)/1000);const t=document.getElementById('tyT');if(t)t.textContent=left>0?`剩下 ${Math.floor(left/60)} 分 ${String(left%60).padStart(2,'0')} 秒`:'時間到';if(left<=0)finish();},500);}paint();});
    paint();box.focus();
    $('#next').onclick=()=>{if(!box.value.trim()&&!confirm('還沒有打字，確定要跳過嗎？'))return;finish();};
  }
  function experience(){
    const o=opt();
    app.innerHTML=`${steps(4)}<h2>請問你有${esc(o.name)}相關的工作經驗嗎？</h2><p class="sub">${o.category==='duty'?'例如保全、警衛、門禁管理等工作。':'例如物業管理、社區秘書、櫃台、行政等工作。'}接下來的題目會依你的經驗出題。</p>
      <div class="opts" style="grid-template-columns:1fr 1fr"><div class="opt" data-e="1"><i>🌱</i><b>有</b><span>做過相關工作</span></div><div class="opt" data-e="0"><i>✨</i><b>沒有</b><span>第一次做這類工作</span></div></div>
      <div id="yrs" style="display:none;margin-top:16px" class="grid"><label>大約幾年<input type="number" id="f-years" min="0" max="60" step="0.5" value="1"></label></div><div class="err" id="err"></div>
      <div class="bar"><span></span><button id="next" disabled>開始作答</button></div>`;
    noAutofill();
    app.querySelectorAll('[data-e]').forEach(el=>el.onclick=()=>{S.exp=el.dataset.e==='1';app.querySelectorAll('[data-e]').forEach(x=>x.classList.toggle('sel',x===el));$('#yrs').style.display=S.exp?'':'none';$('#next').disabled=false;});
    $('#next').onclick=async()=>{try{const r=await api('/questions',{token:S.token,experienced:S.exp,years:Number($('#f-years').value)||0});S.questions=r.questions;S.answers={};tQuiz=Date.now();quiz();}catch(e){if(e.status===410||e.status===401){alert(e.message);return e.status===401?login(e.message):start();}showErr(e.message);}};
  }
  function quiz(){
    const Q=S.questions;
    app.innerHTML=`${steps(5)}<h2>小小考核</h2><p class="sub">共 ${Q.length} 題。選擇題點選答案就好；情境題請寫下你會怎麼做，沒有標準答案，照你的想法寫就可以。<span class="timer" id="tm"></span></p>
      ${Q.map((q,i)=>`<div class="q" data-q="${q.id}"><span class="pt">${q.type==='multi'?'複選':q.type==='text'?'情境題':''}</span><h3>${i+1}. ${esc(q.text)}</h3>${q.type==='text'?`<textarea rows="5" data-t="${q.id}" placeholder="請在這裡輸入你的回答"></textarea>`:q.options.map((o,k)=>`<label class="opt2"><input type="${q.type==='multi'?'checkbox':'radio'}" name="${q.id}" value="${k}"><span>${String.fromCharCode(65+k)}. ${esc(o)}</span></label>`).join('')}</div>`).join('')}
      <div class="err" id="err"></div><div class="bar"><span id="left" class="timer"></span><button id="send">送出</button></div>`;
    noAutofill();
    const tick=()=>{if(!$('#tm'))return;const s=Math.round((Date.now()-tQuiz)/1000);$('#tm').textContent=`　已作答 ${Math.floor(s/60)} 分 ${s%60} 秒`;setTimeout(tick,1000);};tick();
    const collect=()=>{for(const q of Q){if(q.type==='text')S.answers[q.id]=app.querySelector(`[data-t="${q.id}"]`).value;else if(q.type==='single'){const c=app.querySelector(`[name="${q.id}"]:checked`);S.answers[q.id]=c?Number(c.value):null;}else S.answers[q.id]=[...app.querySelectorAll(`[name="${q.id}"]:checked`)].map(x=>Number(x.value));}
      const miss=Q.filter(q=>q.type==='text'?!String(S.answers[q.id]).trim():q.type==='single'?S.answers[q.id]===null:!S.answers[q.id].length);$('#left').textContent=miss.length?`還有 ${miss.length} 題沒有作答`:'全部都作答了 👍';return miss;};
    if(app._ac)app._ac.abort();app._ac=new AbortController();app.addEventListener('change',collect,{signal:app._ac.signal});app.addEventListener('input',collect,{signal:app._ac.signal});collect();
    $('#send').onclick=async()=>{const miss=collect();if(miss.length&&!confirm(`還有 ${miss.length} 題沒有作答，確定要送出嗎？送出後就不能修改了。`))return;if(!miss.length&&!confirm('確定要送出嗎？送出後就不能修改了。'))return;
      $('#send').disabled=true;const now=Date.now();
      try{await api('/submit',{token:S.token,answers:S.answers,metrics:{...metrics,resume_seconds:Math.round(tResume/1000),quiz_seconds:Math.round((now-tQuiz)/1000),total_seconds:Math.round((now-t0)/1000),screen_w:screen.width,screen_h:screen.height,touch:navigator.maxTouchPoints||0}});done();}
      catch(e){$('#send').disabled=false;if(e.status===410||e.status===401){alert(e.message);return e.status===401?login(e.message):start();}showErr(e.message);}};
  }
  // 送出後：立刻清掉這位面試者的所有資料，倒數後回到開始畫面
  function done(){
    if(app._ac)app._ac.abort();S=null;clearTimeout(idle);window.scrollTo(0,0);let n=15;
    app.innerHTML=`${steps(6)}<div class="hello"><div class="leaf">🌷</div><h2>完成了，辛苦你了！</h2><p>資料已經交給面試主管，請稍坐一下，主管會再跟你聊聊。</p><p class="sub" id="cd"></p><button id="again" class="sec2">回到開始畫面</button></div>`;
    const t=setInterval(()=>{n--;if($('#cd'))$('#cd').textContent=`${n} 秒後回到開始畫面`;if(n<=0){clearInterval(t);start();}},1000);$('#again').onclick=()=>{clearInterval(t);start();};
  }
  boot();
})();
</script>
</body>
</html>
