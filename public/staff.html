<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>社區管理工作平台｜人員工作台</title><link rel="stylesheet" href="styles.css?v=4.6.3"></head><body>
<div class="topbar"><button class="sidebar-toggle" id="sidebarToggle" aria-label="開啟選單">☰</button><div><div class="brand">社區管理工作平台</div><div class="sub">物業管理數位工作平台</div></div><div id="staffTop" class="staff-top" style="display:none"><span id="staffName"></span><button class="top-link" id="staffLogout">登出</button></div></div>

<div class="shell"><div id="pageNotice" class="floating-notice"><button type="button" class="notice-close" data-close-notice aria-label="關閉通知">×</button><div class="notice-kicker">👋 工作台通知</div><strong>歡迎使用社區管理工作台</strong><p>交接清冊可以分頁填寫並自動保存；工作日誌與公司文件功能將陸續加入。</p></div><div id="loginView" class="panel login-box" style="display:none"><h2>👤 物業人員登入</h2><p class="hint">請使用您的「員編＋密碼」登入。填寫到一半可以離開，系統會自動保存，下次登入可繼續。</p><div id="loginMsg"></div><form id="staffLoginForm"><div class="field"><label>員編</label><input id="employeeId" autocomplete="username" required placeholder="例如：A001"></div><div class="field" style="display:none"><label>公司代碼（同員編跨公司時使用）</label><input id="staffTenantCode" autocomplete="organization" placeholder="例如 abc-property"></div><div class="field"><label>密碼</label><input id="employeePassword" type="password" autocomplete="current-password" required placeholder="請輸入密碼"></div><button type="submit">登入開始填寫</button></form><p class="hint" style="margin-top:18px">公司管理員請使用「公司管理後台」登入。</p><p style="margin-top:10px"><a href="company.html" class="top-link" style="display:inline-block;text-decoration:none">🏢 公司管理員後台</a></p></div><div id="homeView" style="display:none"><div id="staffHome"></div></div><div id="editorView" style="display:none"><div id="draftBar" class="draft-bar"></div><div id="progressArea" class="progress-area"></div><div id="msgArea"></div><form id="checklistForm"></form></div></div><script src="sidebar.js?v=4.6.3"></script><script src="app.js?v=4.6.3"></script></body></html>
