<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>社區管理工作平台｜人員工作台</title><link rel="stylesheet" href="styles.css?v=5.0.3"></head><body>

<div class="shell"><div id="pageNotice" class="floating-notice"><button type="button" class="notice-close" data-close-notice aria-label="關閉通知">×</button><div class="notice-kicker">👋 工作台通知</div><strong>歡迎使用社區管理工作台</strong><p>交接清冊可以分頁填寫並自動保存；工作日誌與公司文件功能將陸續加入。</p></div><div id="loginView" class="login-page" style="display:none"><div class="login-card"><div class="login-company">（公司名稱）</div><h2>👤 人員後台系統登入</h2><p class="login-intro">請使用您的「員編」進行登入。</p><div id="loginMsg"></div><form id="staffLoginForm"><div class="login-fields"><div class="field"><label>員編</label><input id="employeeId" autocomplete="username" required placeholder=""></div><div class="field" style="display:none"><label>公司代碼（同員編跨公司時使用）</label><input id="staffTenantCode" autocomplete="organization" placeholder="例如 abc-property"></div><div class="field"><label>密碼</label><input id="employeePassword" type="password" autocomplete="current-password" required placeholder=""></div><div class="login-help">忘記員編／忘記密碼</div></div><button type="submit" class="login-submit">登入</button></form></div></div><div id="homeView" style="display:none"><div id="staffHome"></div></div><div id="editorView" style="display:none"><div id="draftBar" class="draft-bar"></div><div id="progressArea" class="progress-area"></div><div id="msgArea"></div><form id="checklistForm"></form></div></div><script src="sidebar.js?v=5.0.3"></script><script src="app.js?v=5.0.3"></script></body></html>
